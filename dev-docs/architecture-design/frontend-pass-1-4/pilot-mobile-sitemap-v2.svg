<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 500" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>AevoFab mobile sitemap v2</title>
  <desc>Mobile app sitemap with 5 bottom-nav tabs: Today, Jobs, Voice, Code, Owner. Owner tab gated by RBAC.</desc>

  <defs>
    <style>
      .ts { font-size: 12px; fill: #57534E; }
      .th { font-size: 14px; font-weight: 500; fill: #1C1917; }
      .tab-text-shared { font-size: 14px; font-weight: 500; fill: #04342C; }
      .tab-sub-shared { font-size: 12px; fill: #085041; }
      .tab-text-owner { font-size: 14px; font-weight: 500; fill: #451A03; }
      .tab-sub-owner { font-size: 12px; fill: #78350F; }
      .route-text { font-size: 12px; fill: #232AA3; }
      .leader { stroke: #A8A29E; stroke-width: 0.5; stroke-dasharray: 3 3; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#57534E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="260" y="20" width="160" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central" fill="#26215C">apps/mobile</text>
  <text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Expo · tech primary</text>

  <line x1="340" y1="68" x2="340" y2="92" stroke="#57534E" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="92" width="600" height="44" rx="8" fill="#F5F5F4" stroke="#57534E" stroke-width="0.5"/>
  <text class="th" x="340" y="107" text-anchor="middle" dominant-baseline="central">Bottom tab bar · 5 tabs</text>
  <text class="ts" x="340" y="123" text-anchor="middle" dominant-baseline="central">Owner tab conditionally rendered when role === owner</text>

  <g stroke="#A8A29E" stroke-width="0.5">
    <line x1="120" y1="136" x2="120" y2="160"/>
    <line x1="240" y1="136" x2="240" y2="160"/>
    <line x1="340" y1="136" x2="340" y2="160"/>
    <line x1="440" y1="136" x2="440" y2="160"/>
    <line x1="560" y1="136" x2="560" y2="160"/>
  </g>

  <rect x="60" y="160" width="120" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="tab-text-shared" x="120" y="178" text-anchor="middle" dominant-baseline="central">Today</text>
  <text class="tab-sub-shared" x="120" y="196" text-anchor="middle" dominant-baseline="central">all roles</text>

  <rect x="180" y="160" width="120" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="tab-text-shared" x="240" y="178" text-anchor="middle" dominant-baseline="central">Jobs</text>
  <text class="tab-sub-shared" x="240" y="196" text-anchor="middle" dominant-baseline="central">all roles</text>

  <rect x="280" y="160" width="120" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="tab-text-shared" x="340" y="178" text-anchor="middle" dominant-baseline="central">Voice</text>
  <text class="tab-sub-shared" x="340" y="196" text-anchor="middle" dominant-baseline="central">all roles</text>

  <rect x="380" y="160" width="120" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="tab-text-shared" x="440" y="178" text-anchor="middle" dominant-baseline="central">Code</text>
  <text class="tab-sub-shared" x="440" y="196" text-anchor="middle" dominant-baseline="central">all roles</text>

  <rect x="500" y="160" width="120" height="48" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="tab-text-owner" x="560" y="178" text-anchor="middle" dominant-baseline="central">Owner</text>
  <text class="tab-sub-owner" x="560" y="196" text-anchor="middle" dominant-baseline="central">owner role only</text>

  <g stroke="#A8A29E" stroke-width="0.5">
    <line x1="120" y1="208" x2="120" y2="232"/>
    <line x1="240" y1="208" x2="240" y2="232"/>
    <line x1="340" y1="208" x2="340" y2="232"/>
    <line x1="440" y1="208" x2="440" y2="232"/>
    <line x1="560" y1="208" x2="560" y2="232"/>
  </g>

  <g font-size="0">
    <rect x="60" y="232" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="120" y="247" text-anchor="middle" dominant-baseline="central">Clock in / out</text>
    <rect x="60" y="266" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="120" y="281" text-anchor="middle" dominant-baseline="central">Today's schedule</text>
    <rect x="60" y="300" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="120" y="315" text-anchor="middle" dominant-baseline="central">Current timer</text>
    <rect x="60" y="334" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="120" y="349" text-anchor="middle" dominant-baseline="central">Inbox</text>

    <rect x="180" y="232" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="240" y="247" text-anchor="middle" dominant-baseline="central">Assigned jobs</text>
    <rect x="180" y="266" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="240" y="281" text-anchor="middle" dominant-baseline="central">Job detail</text>
    <rect x="180" y="300" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="240" y="315" text-anchor="middle" dominant-baseline="central">Communicate</text>
    <rect x="180" y="334" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="240" y="349" text-anchor="middle" dominant-baseline="central">Log expense</text>
    <rect x="180" y="368" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="240" y="383" text-anchor="middle" dominant-baseline="central">Change order</text>
    <rect x="180" y="402" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="240" y="417" text-anchor="middle" dominant-baseline="central">Complete job</text>
    <rect x="180" y="436" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="240" y="451" text-anchor="middle" dominant-baseline="central">LOTO check</text>

    <rect x="280" y="232" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="340" y="247" text-anchor="middle" dominant-baseline="central">Press to speak</text>
    <rect x="280" y="266" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="340" y="281" text-anchor="middle" dominant-baseline="central">Voice history</text>
    <rect x="280" y="300" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="340" y="315" text-anchor="middle" dominant-baseline="central">Quick lookup</text>

    <rect x="380" y="232" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="440" y="247" text-anchor="middle" dominant-baseline="central">Voltage drop</text>
    <rect x="380" y="266" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="440" y="281" text-anchor="middle" dominant-baseline="central">Conduit fill</text>
    <rect x="380" y="300" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="440" y="315" text-anchor="middle" dominant-baseline="central">Ampacity</text>
    <rect x="380" y="334" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="440" y="349" text-anchor="middle" dominant-baseline="central">NEC reference</text>
    <rect x="380" y="368" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="440" y="383" text-anchor="middle" dominant-baseline="central">Saved calcs</text>

    <rect x="500" y="232" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="560" y="247" text-anchor="middle" dominant-baseline="central">Approvals</text>
    <rect x="500" y="266" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="560" y="281" text-anchor="middle" dominant-baseline="central">Pending quotes</text>
    <rect x="500" y="300" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="560" y="315" text-anchor="middle" dominant-baseline="central">Send quote</text>
    <rect x="500" y="334" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="560" y="349" text-anchor="middle" dominant-baseline="central">Send invoice</text>
    <rect x="500" y="368" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="560" y="383" text-anchor="middle" dominant-baseline="central">AR status</text>
    <rect x="500" y="402" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="560" y="417" text-anchor="middle" dominant-baseline="central">QB sync status</text>
    <rect x="500" y="436" width="120" height="30" rx="4" fill="#EEF1FF" stroke="#3B43D6" stroke-width="0.5"/>
    <text class="route-text" x="560" y="451" text-anchor="middle" dominant-baseline="central">Plan usage</text>
  </g>

  <line x1="500" y1="281" x2="470" y2="281" class="leader"/>
  <text class="ts" x="460" y="281" text-anchor="end" dominant-baseline="central">Apply discount (cap-enforced)</text>
</svg>
