# Pilot for Trades - Unified Docker Compose Configuration
# 
# This file consolidates all services into a single stack:
# - Backend Infrastructure: PostgreSQL 17 + Redis 7
# - Background Processing: Celery worker + Celery beat scheduler
# - AI Pipeline: Ollama (Llama 3.1 8B) + Whisper (large-v3-turbo locally; large-v3 on the AWS GPU)
#
# All services run on a shared network for seamless communication.
# Database data persists in the "postgres_data" named volume.
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose up -d postgres redis celery_worker celery_beat  # Backend only
#   docker compose logs -f celery_worker  # View worker logs
#   docker compose down               # Stop all services (preserves data)
#   docker compose down -v            # Stop all services AND delete volumes (data loss!)

services:
  # ============================================================================
  # DATABASE: PostgreSQL 17 with pgvector extension
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pilot_postgres
    # Load database credentials from backend/.env (single source of truth)
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pilot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_DB_PW}
      POSTGRES_DB: ${POSTGRES_DB:-pilot_dev}
    ports:
      - "5432:5432"
    volumes:
      # CRITICAL: Uses named volume "postgres_data" to preserve database files
      # This volume persists even if containers are removed
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pilot_user}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # REDIS: Celery broker and result backend
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: pilot_redis
    ports:
      - "6379:6379"
    networks:
      - pilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # CELERY WORKER: Processes background tasks
  # ============================================================================
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pilot_celery_worker
    command: celery -A core.celery_app worker --loglevel=info --concurrency=2
    volumes:
      # Mount backend code for hot-reloading during development
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Load ALL environment variables from backend/.env
    env_file:
      - ./backend/.env
    environment:
      # Override specific variables for Docker networking
      # (these take precedence over env_file values)
      
      # Celery broker uses Docker service name 'redis' instead of 'localhost'
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      
      # Database uses Docker service name 'postgres' instead of 'localhost'
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pilot_user}:${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_DB_PW}@postgres:5432/${POSTGRES_DB:-pilot_dev}
      
      # AI Services use Docker service names instead of 'localhost'
      - WHISPER_API_URL=http://whisper:8000/v1
      - OLLAMA_API_URL=http://ollama:11434/api
    networks:
      - pilot-network
    restart: unless-stopped

  # ============================================================================
  # CELERY BEAT: Scheduler for periodic tasks
  # ============================================================================
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pilot_celery_beat
    command: celery -A core.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    # Load ALL environment variables from backend/.env
    env_file:
      - ./backend/.env
    environment:
      # Override specific variables for Docker networking
      # (these take precedence over env_file values)
      
      # Celery broker uses Docker service name 'redis' instead of 'localhost'
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      
      # Database uses Docker service name 'postgres' instead of 'localhost'
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pilot_user}:${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_DB_PW}@postgres:5432/${POSTGRES_DB:-pilot_dev}
    networks:
      - pilot-network
    restart: unless-stopped

  # ============================================================================
  # OLLAMA: Local LLM inference (Llama 3.1 8B for intent parsing)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: pilot_ollama
    ports:
      - "11434:11434"
    volumes:
      # Persist downloaded models (llama3.1:8b is ~4.7GB)
      - ollama_data:/root/.ollama
    networks:
      - pilot-network
    restart: unless-stopped
    # Optional: Uncomment to use GPU (requires NVIDIA Docker runtime)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ============================================================================
  # WHISPER: Speech-to-Text API (Faster-Whisper-Server)
  # ============================================================================
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: pilot_whisper
    ports:
      - "8080:8000"  # Maps container port 8000 to host port 8080
    environment:
      - WHISPER_MODEL=turbo  # Options: tiny, base, small, medium, large-v2, large-v3, turbo
      - WHISPER__MODEL=Systran/faster-whisper-large-v3-turbo
    volumes:
      # Cache downloaded Whisper models (~1.5GB for turbo)
      - whisper_data:/root/.cache/huggingface
    networks:
      - pilot-network
    restart: unless-stopped

# ==============================================================================
# VOLUMES: Named volumes for persistent data
# ==============================================================================
volumes:
  postgres_data:
    # CRITICAL: Use existing backend_postgres_data volume
    # This preserves your existing database across the migration
    external: true
    name: backend_postgres_data
  
  ollama_data:
    # Stores downloaded Ollama models (llama3.1:8b = ~4.7GB)
  
  whisper_data:
    # Stores downloaded Whisper models (turbo = ~1.5GB)

# ==============================================================================
# NETWORKS: Shared bridge network for inter-container communication
# ==============================================================================
networks:
  pilot-network:
    driver: bridge
    # All services can communicate using service names as hostnames:
    # - postgres:5432
    # - redis:6379
    # - ollama:11434
    # - whisper:8000
