[pytest]
# Pytest configuration for the Pilot for Trades backend

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    # ── Test type markers ──────────────────────────────────────────────────────
    unit: Unit tests (isolated, mocked dependencies; auto-applied by conftest hook)
    integration: Integration tests (real external services like SendGrid, Telnyx)
    e2e: End-to-end tests (full pipeline verification)
    slow: Tests that take longer than 1 second
    # ── External service requirement markers ───────────────────────────────────
    requires_redis: Tests that require Redis connection
    requires_db: Tests that require database connection
    requires_sendgrid: Tests that require SendGrid API credentials
    requires_telnyx: Tests that require Telnyx API credentials (B21/FIND-173: integration tests against Telnyx sandbox)
    requires_twilio: Tests that require Twilio API credentials (legacy reference)
    requires_ollama: Tests that must call the real Ollama/LLM container (skips autouse mock_ai_services fixture for Ollama calls)
    requires_whisper: Tests that must call the real Whisper container (skips autouse mock_ai_services fixture for Whisper calls)
    requires_stripe: Tests that require a real Stripe test-mode API key (sk_test_...)
    # ── Fixture control markers ────────────────────────────────────────────────
    skip_mock_entitlement_allowed: Skip the autouse mock_entitlement_allowed fixture (use for real entitlement enforcement tests)
    # ── Domain markers (PRD §3) — auto-applied by conftest hook for legacy batches ──
    domain_audit_compliance: PRD §3.1 — Audit logs, deletion pathways, S3 archive
    domain_catalog_pricing: PRD §3.2 — Pricebook, supplier prices, labor rates
    domain_crm: PRD §3.3 — Customers, sites, contacts
    domain_field_operations: PRD §3.4 — Jobs, change orders, LOTO, ETC, GPS check-in
    domain_identity_access: PRD §3.5 — RBAC, MFA, sessions, tenant signup, onboarding
    domain_invoicing_billing: PRD §3.6 — Invoices, Stripe, public links, dunning
    domain_notifications_comms: PRD §3.7 — Notification outbox, SMS, push, preference matrix
    domain_platform_infrastructure: PRD §3.8 — Settings resolver, dashboard, reports, webhooks
    domain_quickbooks: PRD §3.9 — QB OAuth, sync, conflict resolution, invoice push
    domain_sales_quoting: PRD §3.10 — Quotes, discounts, pending edits, templates
    domain_subscriptions_usage: PRD §3.11 — Subscription tiers, entitlements, Stripe lifecycle
    domain_tax_calculation: PRD §3.12 — Tax rate versions, taxability propagation
    domain_voice_ai: PRD §3.13 — Voice intents, conversation sessions, multi-turn context
    domain_scheduling_dispatch: PRD §3.14 — Dispatch board, assignments, conflict detection
    domain_mobile_offline: PRD §3.15 — Offline sync, photo upload, dedup, auth expiry
    domain_help_support: PRD §3.16 — Help chat, RAG corpus, feedback, HNSW index

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    -ra

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0
